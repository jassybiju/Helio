events {}

http {

    ##
    ## Rate limiting
    ##
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ##
    ## WebSocket support
    ##
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ##
    ## Common proxy headers
    ##
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;


    ## HTTP => HTTPS Redirects
    server {
        listen 80;
        server_name itsjassy.xyz www.itsjassy.xyz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name admin.itsjassy.xyz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name doctor.itsjassy.xyz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name grafana.itsjassy.xyz;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name api.itsjassy.xyz;

        return 301 https://$host$request_uri;
    }

    ##
    ## Patient Frontend
    ##
    server {
        listen 443 ssl;
        server_name itsjassy.xyz www.itsjassy.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;


        location / {
            proxy_pass http://frontend:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

        }
    }

    ##
    ## Admin Frontend
    ##
    server {
        listen 443 ssl;
        server_name admin.itsjassy.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;


        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
        }
    }

    ##
    ## Doctor Frontend
    ##
    server {
        listen 443 ssl;
        server_name doctor.itsjassy.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.itsjassy.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    ##
    ## Backend API
    ##
    server {
        listen 443 ssl;
        server_name api.itsjassy.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ##
        ## Upload endpoints
        ##
        location = /v1/api/doctor/verification/resubmit {
            client_max_body_size 20M;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend:5000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location = /api/doctors/upload {
            client_max_body_size 20M;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend:5000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /api/prescriptions/upload {
            client_max_body_size 20M;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend:5000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /api/documents/upload {
            client_max_body_size 20M;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend:5000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        ##
        ## Everything else
        ##
        location / {

            # Global API protection
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend:5000;

            # Required for Socket.IO / WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Long-lived WebSocket connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}