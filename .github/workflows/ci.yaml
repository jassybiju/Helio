name: Helio CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: |
            docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/helio-backend:latest \
            ./server
      
      - name: Build Frontend
        run: |
             docker build \
             -t ${{ secrets.DOCKER_USERNAME }}/helio-frontend:latest \
             ./client

      - name: Push Images
        run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/helio-backend:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/helio-frontend:latest
