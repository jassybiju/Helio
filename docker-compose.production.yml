
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - frontend
      - backend

    networks:
      - app
  backend:
    image: jassymon/helio-backend:latest
    
    container_name: backend

    restart: always

    env_file:
      - ./server/.env

    depends_on:
      - redis
      - qdrant

    networks:
      - app

  worker:
    image: jassymon/helio-worker:latest

    container_name: worker

    restart: always

    env_file:
      - ./server/.env

    command: node dist/workers/emailWorker.js

    depends_on:
      - redis
    
    networks:
      - app

  frontend:
    image: jassymon/helio-frontend:latest


    container_name: frontend

    restart: always


    depends_on:
      - backend

    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: redis

    restart: always

    volumes:
      - redis_data:/data

    networks:
      - app

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    
    restart: always

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - app

  gotenberg:
    image : gotenberg/gotenberg:8-chromium
    ports:
      - "4000:3000"
    networks:
      - app


networks:
  app:

volumes:
  redis_data:
  qdrant_data:
